<svg viewBox="0 0 1200 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Night sky over mountains with an open book and falling sakura petals">
  <defs>
    <linearGradient id="skyTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#05060f"/>
      <stop offset="45%" stop-color="#10132b"/>
      <stop offset="78%" stop-color="#241a45"/>
      <stop offset="100%" stop-color="#3a2a5c"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe9b8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffe9b8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mtnBack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#241a45"/>
      <stop offset="100%" stop-color="#1a1436"/>
    </linearGradient>
    <linearGradient id="mtnFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#130f28"/>
      <stop offset="100%" stop-color="#0a0818"/>
    </linearGradient>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2350"/>
      <stop offset="100%" stop-color="#100c22"/>
    </linearGradient>
    <linearGradient id="pageGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8ecbff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#c7dfff" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="480" fill="url(#skyTop)"/>

  <!-- stars -->
  <g fill="#f5f7ff">
    <circle cx="80" cy="60" r="1.6" opacity="0.9"/>
    <circle cx="160" cy="120" r="1.1" opacity="0.7"/>
    <circle cx="260" cy="50" r="1.4" opacity="0.8"/>
    <circle cx="340" cy="140" r="1" opacity="0.6"/>
    <circle cx="430" cy="70" r="1.6" opacity="0.9"/>
    <circle cx="520" cy="30" r="1.1" opacity="0.7"/>
    <circle cx="610" cy="100" r="1.3" opacity="0.8"/>
    <circle cx="700" cy="55" r="1" opacity="0.6"/>
    <circle cx="120" cy="200" r="1.2" opacity="0.7"/>
    <circle cx="980" cy="80" r="1.5" opacity="0.85"/>
    <circle cx="1050" cy="150" r="1.1" opacity="0.7"/>
    <circle cx="1120" cy="60" r="1.4" opacity="0.9"/>
    <circle cx="900" cy="180" r="1" opacity="0.6"/>
    <circle cx="1150" cy="220" r="1.2" opacity="0.7"/>
  </g>

  <!-- moon -->
  <circle cx="960" cy="110" r="120" fill="url(#moonGlow)"/>
  <circle cx="960" cy="110" r="46" fill="#ffe9b8"/>
  <circle cx="978" cy="96" r="40" fill="url(#skyTop)"/>

  <!-- back mountains -->
  <path d="M0 320 L120 240 L230 300 L330 210 L460 300 L560 250 L680 320 L800 260 L920 310 L1040 250 L1200 300 L1200 480 L0 480 Z" fill="url(#mtnBack)" opacity="0.85"/>

  <!-- sakura branch, top-left corner -->
  <g opacity="0.9">
    <path d="M0 40 C 60 10, 120 50, 190 20" stroke="#4a3a63" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M40 30 C 50 10, 60 5, 70 -5" stroke="#4a3a63" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M100 38 C 108 20, 120 12, 130 2" stroke="#4a3a63" stroke-width="3" fill="none" stroke-linecap="round"/>
    <g fill="#f6b8c9">
      <circle cx="46" cy="14" r="7"/>
      <circle cx="66" cy="6" r="6"/>
      <circle cx="112" cy="18" r="7"/>
      <circle cx="134" cy="0" r="6"/>
      <circle cx="18" cy="34" r="6"/>
      <circle cx="160" cy="24" r="6"/>
    </g>
  </g>

  <!-- falling petals -->
  <g fill="#f6b8c9" opacity="0.85">
    <ellipse cx="220" cy="140" rx="5" ry="3.4" transform="rotate(30 220 140)"/>
    <ellipse cx="300" cy="220" rx="5" ry="3.4" transform="rotate(-15 300 220)"/>
    <ellipse cx="140" cy="260" rx="4.5" ry="3" transform="rotate(50 140 260)"/>
    <ellipse cx="380" cy="160" rx="4.5" ry="3" transform="rotate(10 380 160)"/>
    <ellipse cx="60" cy="180" rx="4" ry="2.6" transform="rotate(70 60 180)"/>
  </g>

  <!-- front mountains -->
  <path d="M0 400 L150 300 L280 370 L400 280 L540 380 L680 300 L820 390 L960 310 L1100 380 L1200 340 L1200 480 L0 480 Z" fill="url(#mtnFront)"/>

  <!-- open book silhouette, foreground centered -->
  <g transform="translate(430,330)">
    <path d="M0 60 C 60 20, 150 20, 190 60 L190 130 C 150 96, 60 96, 0 130 Z" fill="url(#bookGrad)" stroke="#3a2f66" stroke-width="2"/>
    <path d="M190 60 C 230 20, 320 20, 380 60 L380 130 C 320 96, 230 96, 190 130 Z" fill="url(#bookGrad)" stroke="#3a2f66" stroke-width="2"/>
    <path d="M190 60 L190 130" stroke="#0a0818" stroke-width="3"/>
    <g stroke="url(#pageGlow)" stroke-width="2" stroke-linecap="round" opacity="0.8">
      <path d="M30 72 C 80 46, 140 46, 178 70"/>
      <path d="M22 92 C 78 64, 140 64, 182 90"/>
      <path d="M18 112 C 78 84, 142 84, 186 110"/>
      <path d="M202 70 C 240 46, 300 46, 350 72"/>
      <path d="M198 90 C 240 64, 302 64, 358 92"/>
      <path d="M196 110 C 240 84, 304 84, 362 112"/>
    </g>
    <!-- small light motes rising from the book, like ideas/story sparks -->
    <g fill="#8ecbff" opacity="0.9">
      <circle cx="190" cy="10" r="3"/>
      <circle cx="160" cy="-16" r="2.2"/>
      <circle cx="222" cy="-24" r="2.6"/>
      <circle cx="190" cy="-40" r="1.8"/>
    </g>
  </g>
</svg>
