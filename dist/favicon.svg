<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#1c2148"/>
      <stop offset="55%" stop-color="#0e1130"/>
      <stop offset="100%" stop-color="#05060f"/>
    </radialGradient>
    <linearGradient id="badge-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8ecbff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#4f8cff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="mark-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a9d4ff"/>
      <stop offset="42%" stop-color="#4f8cff"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="mark-shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="spark-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e9f2ff"/>
      <stop offset="100%" stop-color="#8ecbff"/>
    </radialGradient>
    <filter id="soft-shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#4f8cff" flood-opacity="0.35"/>
    </filter>
    <clipPath id="badge-clip">
      <rect x="4" y="4" width="248" height="248" rx="62"/>
    </clipPath>
    <clipPath id="mark-clip">
      <path d="
        M128 46
        L180 190
        L154 190
        L145 164
        L111 164
        L102 190
        L76 190
        L120 68
        Z
        M128 92
        L114 142
        L142 142
        Z
      " fill-rule="evenodd"/>
    </clipPath>
  </defs>

  <!-- rounded-square app-icon badge -->
  <rect x="4" y="4" width="248" height="248" rx="62" fill="url(#bg-glow)"/>
  <rect x="4" y="4" width="248" height="248" rx="62" fill="none" stroke="url(#badge-border)" stroke-width="2.5" opacity="0.8"/>

  <g clip-path="url(#badge-clip)">
    <!-- faint focus ring echoing the navbar brand mark -->
    <circle cx="128" cy="132" r="98" fill="none" stroke="url(#badge-border)" stroke-width="1.6" opacity="0.28" stroke-dasharray="3 9"/>

    <!-- "A" monogram, apex notched into a lightning-bolt point -->
    <g filter="url(#soft-shadow)">
      <path d="
        M128 46
        L180 190
        L154 190
        L145 164
        L111 164
        L102 190
        L76 190
        L120 68
        Z
        M128 92
        L114 142
        L142 142
        Z
      " fill="url(#mark-grad)" fill-rule="evenodd"/>
      <!-- bolt notch cut through the crossbar -->
      <path d="M136 118 L120 146 L131 146 L118 172 L146 138 L133 138 Z" fill="url(#bg-glow)"/>
      <path d="M134 120 L121 144 L130 144 L120 166 L143 138 L132 138 Z" fill="url(#spark-grad)"/>
    </g>

    <!-- glossy highlight, clipped to the mark so it reads as a light sheen, not a smudge -->
    <ellipse cx="128" cy="80" rx="70" ry="30" fill="url(#mark-shine)" opacity="0.55" clip-path="url(#mark-clip)"/>

    <!-- charged accent sparks -->
    <circle cx="196" cy="76" r="5.5" fill="url(#spark-grad)"/>
    <circle cx="58" cy="176" r="4" fill="url(#spark-grad)" opacity="0.85"/>
  </g>
</svg>
