<svg viewBox="0 0 1200 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sunset skyline with a torii gate, floating paper pages and lanterns">
  <defs>
    <linearGradient id="duskSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1436"/>
      <stop offset="35%" stop-color="#3a2a5c"/>
      <stop offset="65%" stop-color="#a15a6e"/>
      <stop offset="85%" stop-color="#e0894f"/>
      <stop offset="100%" stop-color="#ffd27a"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe1a3" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffe1a3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cityBack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2140"/>
      <stop offset="100%" stop-color="#241a38"/>
    </linearGradient>
    <linearGradient id="cityFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#160f24"/>
      <stop offset="100%" stop-color="#0a0818"/>
    </linearGradient>
    <linearGradient id="torii" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a1f22"/>
      <stop offset="100%" stop-color="#160c0e"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="480" fill="url(#duskSky)"/>

  <!-- sun -->
  <circle cx="600" cy="230" r="150" fill="url(#sunGlow)"/>
  <circle cx="600" cy="230" r="62" fill="#ffe1a3"/>

  <!-- soft clouds -->
  <g fill="#f5d7c9" opacity="0.35">
    <ellipse cx="220" cy="150" rx="90" ry="16"/>
    <ellipse cx="950" cy="120" rx="120" ry="18"/>
    <ellipse cx="150" cy="260" rx="70" ry="12"/>
  </g>

  <!-- back city silhouette -->
  <g fill="url(#cityBack)">
    <rect x="0" y="330" width="60" height="90"/>
    <rect x="70" y="300" width="46" height="120"/>
    <rect x="130" y="340" width="70" height="80"/>
    <rect x="990" y="310" width="50" height="110"/>
    <rect x="1050" y="345" width="70" height="75"/>
    <rect x="1130" y="290" width="46" height="130"/>
  </g>

  <!-- lanterns -->
  <g>
    <g transform="translate(150,190)">
      <ellipse rx="10" ry="13" fill="#ff8a4c"/>
      <line x1="0" y1="-13" x2="0" y2="-26" stroke="#ffcf8a" stroke-width="2"/>
    </g>
    <g transform="translate(1030,170)">
      <ellipse rx="9" ry="12" fill="#ff8a4c"/>
      <line x1="0" y1="-12" x2="0" y2="-24" stroke="#ffcf8a" stroke-width="2"/>
    </g>
    <g transform="translate(1090,230)">
      <ellipse rx="7" ry="9" fill="#ffb27a"/>
      <line x1="0" y1="-9" x2="0" y2="-18" stroke="#ffcf8a" stroke-width="2"/>
    </g>
  </g>

  <!-- torii gate, foreground center-left -->
  <g transform="translate(270,230)" fill="url(#torii)">
    <rect x="-14" y="0" width="16" height="190" rx="3"/>
    <rect x="150" y="0" width="16" height="190" rx="3"/>
    <rect x="-34" y="-10" width="230" height="22" rx="4"/>
    <rect x="-14" y="26" width="180" height="14" rx="3"/>
  </g>

  <!-- floating manga / book pages drifting like paper birds -->
  <g fill="#f5f7ff" opacity="0.92">
    <path d="M430 150 L470 158 L432 172 L420 160 Z"/>
    <path d="M520 100 L556 110 L522 122 L510 110 Z"/>
    <path d="M700 180 L738 190 L702 204 L690 190 Z"/>
    <path d="M760 120 L792 128 L762 140 L750 128 Z"/>
    <path d="M860 210 L892 218 L862 230 L850 218 Z"/>
  </g>

  <!-- front city + ground silhouette -->
  <path d="M0 420 L120 400 L200 430 L340 390 L460 430 L620 400 L760 432 L900 396 L1040 430 L1200 400 L1200 480 L0 480 Z" fill="url(#cityFront)"/>

  <!-- sakura branch accent, bottom-right -->
  <g opacity="0.9" transform="translate(1000,360)">
    <path d="M0 60 C 40 30, 90 40, 140 10" stroke="#3a1f22" stroke-width="5" fill="none" stroke-linecap="round"/>
    <g fill="#f6b8c9">
      <circle cx="30" cy="34" r="6"/>
      <circle cx="70" cy="28" r="7"/>
      <circle cx="110" cy="16" r="6"/>
      <circle cx="140" cy="8" r="5"/>
    </g>
  </g>
</svg>
